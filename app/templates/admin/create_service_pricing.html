{% extends "base.html" %}
{% block content %}

    {% include "includes/sidebar_navbar.html" %}

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1><i class="fas fa-plus-circle mr-2"></i>Create Service Pricing</h1>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="{{ url_for('service_pricing_management') }}">Service Pricing</a></li>
                            <li class="breadcrumb-item active">Create</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                {% if error %}
                <div class="alert alert-danger alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
                {% endif %}

                <div class="row">
                    <div class="col-md-8">
                        <div class="card card-primary">
                            <div class="card-header">
                                <h3 class="card-title"><i class="fas fa-tag mr-1"></i> Service Pricing Details</h3>
                            </div>
                            <form method="POST" action="{{ url_for('create_service_pricing') }}">
                                <div class="card-body">
                                    <div class="form-group">
                                        <label for="service_name">Service Name *</label>
                                        <input type="text" class="form-control" id="service_name" name="service_name" required placeholder="e.g., Consultation, Chest X-Ray, CBC Test">
                                    </div>
                                    <div class="form-group">
                                        <label for="service_code">Service Code (optional)</label>
                                        <input type="text" class="form-control" id="service_code" name="service_code" placeholder="e.g., CONSULT, CXR, CBC">
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="charge_type">Charge Type *</label>
                                                <select class="form-control" id="charge_type" name="charge_type" required>
                                                    <option value="">Select Charge Type</option>
                                                    {% for ct in charge_types %}
                                                    <option value="{{ ct }}">{{ ct|replace('_', ' ')|title }}</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="category">Category (optional)</label>
                                                <input type="text" class="form-control" id="category" name="category" placeholder="e.g., Imaging, Laboratory, Consultation">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="unit_price">Unit Price *</label>
                                                <input type="number" step="0.01" class="form-control" id="unit_price" name="unit_price" required placeholder="0.00">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="currency">Currency *</label>
                                                <select class="form-control" id="currency" name="currency" required>
                                                    <option value="GHS" selected>GHS (Ghana Cedis)</option>
                                                    <option value="USD">USD (US Dollars)</option>
                                                    <option value="EUR">EUR (Euros)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="description">Description (optional)</label>
                                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Description of the service"></textarea>
                                    </div>
                                    <div class="form-group">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="is_active" name="is_active" value="true" checked>
                                            <label class="form-check-label" for="is_active">Active</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save"></i> Create Service Pricing
                                    </button>
                                    <a href="{{ url_for('service_pricing_management') }}" class="btn btn-secondary">
                                        <i class="fas fa-times"></i> Cancel
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

{% endblock %}
