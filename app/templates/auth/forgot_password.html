<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LHIMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl">
        <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-6">
            Forgot Password
        </h2>
        
        {% if status == 'sent' %}
        <div class="mb-4 p-4 bg-green-50 border border-green-200 rounded-md">
            <p class="text-sm text-green-800">
                <strong>Success!</strong> If an account exists with that username, password reset instructions have been sent.
            </p>
        </div>
        {% endif %}
        
        {% if error %}
        <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-md">
            <p class="text-sm text-red-800">{{ error }}</p>
        </div>
        {% endif %}
        
        <form method="POST" action="{{ request.url_for('request_password_reset') }}" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <div class="mt-1">
                    <input id="username" name="username" type="text" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                           placeholder="Enter your username">
                </div>
            </div>

            <div>
                <label for="reset_method" class="block text-sm font-medium text-gray-700 mb-2">Reset Method</label>
                <div class="space-y-2">
                    <label class="flex items-center">
                        <input type="radio" name="reset_method" value="sms" checked class="mr-2">
                        <span class="text-sm text-gray-700">SMS (Recommended)</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="reset_method" value="email" class="mr-2">
                        <span class="text-sm text-gray-700">Email</span>
                    </label>
                </div>
            </div>

            <div id="phone-field" class="reset-field">
                <label for="phone_number" class="block text-sm font-medium text-gray-700">Phone Number</label>
                <div class="mt-1">
                    <input id="phone_number" name="phone_number" type="tel" 
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                           placeholder="e.g., 0244123456 or +233244123456">
                    <p class="mt-1 text-xs text-gray-500">Enter your phone number (Ghana format)</p>
                </div>
            </div>

            <div>
                <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Send Reset Instructions
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ request.url_for('login') }}" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                ← Back to Login
            </a>
        </div>
    </div>

    <script>
        // Show/hide phone field based on reset method
        document.querySelectorAll('input[name="reset_method"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const phoneField = document.getElementById('phone-field');
                const phoneInput = document.getElementById('phone_number');
                if (this.value === 'sms') {
                    phoneField.style.display = 'block';
                    phoneInput.required = true;
                } else {
                    phoneField.style.display = 'none';
                    phoneInput.required = false;
                }
            });
        });
    </script>
</body>
</html>
