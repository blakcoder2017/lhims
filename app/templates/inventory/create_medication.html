{% extends "base.html" %}
{% block content %}

    {% include "includes/sidebar_navbar.html" %}

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1><i class="fas fa-plus-circle mr-2"></i>Add New Medication</h1>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="{{ url_for('inventory_dashboard') }}">Inventory</a></li>
                            <li class="breadcrumb-item active">Add Medication</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                {% if error %}
                <div class="alert alert-danger alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
                {% endif %}

                <div class="row">
                    <div class="col-md-10">
                        <div class="card card-primary">
                            <div class="card-header">
                                <h3 class="card-title"><i class="fas fa-pills mr-1"></i> Medication Details</h3>
                            </div>
                            <form method="POST" action="{{ url_for('create_medication') }}">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="name">Medication Name *</label>
                                                <input type="text" class="form-control" id="name" name="name" required placeholder="e.g., Paracetamol">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="medication_code">Medication Code</label>
                                                <input type="text" class="form-control" id="medication_code" name="medication_code" placeholder="e.g., PAR001">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="generic_name">Generic Name</label>
                                                <input type="text" class="form-control" id="generic_name" name="generic_name" placeholder="e.g., Acetaminophen">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="brand_name">Brand Name</label>
                                                <input type="text" class="form-control" id="brand_name" name="brand_name" placeholder="e.g., Tylenol">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="dosage_form">Dosage Form</label>
                                                <select class="form-control" id="dosage_form" name="dosage_form">
                                                    <option value="">Select...</option>
                                                    <option value="Tablet">Tablet</option>
                                                    <option value="Capsule">Capsule</option>
                                                    <option value="Syrup">Syrup</option>
                                                    <option value="Injection">Injection</option>
                                                    <option value="Cream">Cream</option>
                                                    <option value="Ointment">Ointment</option>
                                                    <option value="Drops">Drops</option>
                                                    <option value="Suspension">Suspension</option>
                                                    <option value="Other">Other</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="strength">Strength</label>
                                                <input type="text" class="form-control" id="strength" name="strength" placeholder="e.g., 500mg, 10ml">
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="unit">Unit</label>
                                                <input type="text" class="form-control" id="unit" name="unit" placeholder="e.g., tablet, bottle, vial">
                                            </div>
                                        </div>
                                    </div>
                                    <hr>
                                    <h5>Pricing Information</h5>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="unit_cost">Unit Cost (GHS)</label>
                                                <input type="number" step="0.01" class="form-control" id="unit_cost" name="unit_cost" placeholder="0.00">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="unit_price">Unit Price (GHS)</label>
                                                <input type="number" step="0.01" class="form-control" id="unit_price" name="unit_price" placeholder="0.00">
                                            </div>
                                        </div>
                                    </div>
                                    <hr>
                                    <h5>Stock Management</h5>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="reorder_level">Reorder Level</label>
                                                <input type="number" class="form-control" id="reorder_level" name="reorder_level" placeholder="Minimum stock level">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="reorder_quantity">Reorder Quantity</label>
                                                <input type="number" class="form-control" id="reorder_quantity" name="reorder_quantity" placeholder="Quantity to reorder">
                                            </div>
                                        </div>
                                    </div>
                                    <hr>
                                    <h5>NHIS & Formulary</h5>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <div class="form-check">
                                                    <input type="checkbox" class="form-check-input" id="is_nhis_covered" name="is_nhis_covered" value="true">
                                                    <label class="form-check-label" for="is_nhis_covered">NHIS Covered</label>
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label for="nhis_code">NHIS Code</label>
                                                <input type="text" class="form-control" id="nhis_code" name="nhis_code" placeholder="NHIS medication code">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <div class="form-check">
                                                    <input type="checkbox" class="form-check-input" id="is_formulary" name="is_formulary" value="true" checked>
                                                    <label class="form-check-label" for="is_formulary">In Formulary</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save"></i> Create Medication
                                    </button>
                                    <a href="{{ url_for('inventory_dashboard') }}" class="btn btn-secondary">
                                        <i class="fas fa-times"></i> Cancel
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

{% endblock %}
