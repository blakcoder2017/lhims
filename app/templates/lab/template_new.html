{% extends "base.html" %}
{% block content %}

    {% include "includes/sidebar_navbar.html" %}

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>New Lab Result Template</h1>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                            <li class="breadcrumb-item"><a href="{{ url_for('lab_samples_dashboard') }}">Laboratory</a></li>
                            <li class="breadcrumb-item"><a href="{{ url_for('lab_templates_list') }}">Result Templates</a></li>
                            <li class="breadcrumb-item active">New</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Create Template</h3>
                    </div>
                    <form method="POST" action="{{ url_for('lab_template_create') }}">
                        <div class="card-body">
                            <div class="form-group">
                                <label for="name">Template Name</label>
                                <input type="text" name="name" id="name" class="form-control" required
                                       placeholder="e.g. Full Blood Count">
                            </div>
                            <div class="form-group">
                                <label for="discipline">Discipline</label>
                                <select name="discipline" id="discipline" class="form-control" required>
                                    <option value="">Select discipline...</option>
                                    <option value="HEMATOLOGY">Hematology</option>
                                    <option value="CHEMISTRY">Chemistry</option>
                                    <option value="MICROBIOLOGY">Microbiology</option>
                                    <option value="SEROLOGY">Serology</option>
                                    <option value="BLOODBANK">Blood Bank</option>
                                    <option value="PARASITOLOGY">Parasitology</option>
                                    <option value="HISTOLOGY">Histology</option>
                                </select>
                            </div>
                        </div>
                        <div class="card-footer">
                            <a href="{{ url_for('lab_templates_list') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus mr-1"></i> Create & Edit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>

{% endblock %}
