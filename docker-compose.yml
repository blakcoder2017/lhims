
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lhims_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lhims}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lhims}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lhims_network

  # Redis Cache (for Celery and caching)
  redis:
    image: redis:7-alpine
    container_name: lhims_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lhims_network

  # LHIMS Application
  app:
    build: .
    container_name: lhims_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Application Settings
      APP_TITLE: ${APP_TITLE:-LHIMS}
      VERSION: ${VERSION:-2.0}
      DEBUG: "False"
      
      # Database Settings (using service names in Docker network)
      SQLALCHEMY_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-lhims}
      
      # Security Settings
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      
      # SMS Settings (Optional)
      SMSONLINEGH_API_KEY: ${SMSONLINEGH_API_KEY:-77fc8a8574646a14f24f60decd7fba2c0d4328be9437064e7e523592d9ee45bd}
      SMSONLINEGH_SENDER: ${SMSONLINEGH_SENDER:-DEI GRATIA}
      
      # Redis URL for Celery
      REDIS_URL: redis://redis:6379/0
      
      # Email Settings (Optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - lhims_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: lhims_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./app/static:/app/static:ro
    networks:
      - lhims_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lhims_network:
    driver: bridge
